name: HX711
on:
  push:
    branches: [HX711]
  pull_request:
    paths:
      - '**/*hx711*'
      - src/main/msp/**
      - src/main/fc/tasks.c
      - src/main/fc/init.c
      - src/main/cli/cli.c
      - src/main/drivers/resource.*
      - src/main/pg/pg_ids.h
      - mk/source.mk
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/test-hx711.sh
  clracingf4:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: disabled
            flags: ''
          - name: hx711
            flags: '-DUSE_HX711'
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init src/config
      - uses: actions/cache@v4
        with:
          path: |
            tools/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi
            downloads/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
          key: arm-gnu-13.3.rel1-linux
      - run: make arm_sdk_install
      - run: make CONFIG=CLRACINGF4 EXTRA_FLAGS="${{ matrix.flags }}" -j2
      - uses: actions/upload-artifact@v4
        with:
          name: CLRACINGF4-${{ matrix.name }}
          path: obj/*.hex
